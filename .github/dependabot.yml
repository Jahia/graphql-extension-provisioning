version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # Jahia parent and platform modules define the target Jahia version
      - dependency-name: "org.jahia.*"
      # Platform-provided OSGi spec artifacts (raising them breaks Import-Package / Require-Capability)
      - dependency-name: "org.osgi:*"
      # Platform-provided GraphQL libraries (Jahia 8.2 ships graphql-java-annotations 21.1)
      - dependency-name: "com.graphql-java:*"
      - dependency-name: "com.graphql-java-kickstart:*"
      - dependency-name: "io.github.graphql-java:*"
      # Test binding must stay on the slf4j 2.0.x-compatible 1.3.x line (see pom.xml)
      - dependency-name: "ch.qos.logback:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # cross-fetch >= 3.2.0 hands back an unbound window.fetch; under @jahia/cypress 7 the e2e
      # GraphQL calls then fail with "TypeError: Illegal invocation" (2026-11 e2e runs). Stay on
      # 3.1.x until this harness moves to @jahia/cypress 8, where cross-fetch 4 works.
      - dependency-name: "cross-fetch"
        versions: [">=3.2.0"]
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

